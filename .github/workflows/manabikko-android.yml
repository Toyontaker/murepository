name: manabikko (Android)

on:
  push:
    paths:
      - "manabikko/**"
      - ".github/workflows/manabikko-android.yml"
  pull_request:
    paths:
      - "manabikko/**"
  workflow_dispatch:

concurrency:
  group: manabikko-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: manabikko

jobs:
  test:
    name: lint + unit/UI tests + release build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Lint, tests, release bundle
        run: ./gradlew --no-daemon --continue lintDebug lintRelease testDebugUnitTest assembleRelease bundleRelease
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-reports
          path: |
            manabikko/app/build/reports
            manabikko/app/build/test-results

  emulator:
    name: device tests + monkey (API ${{ matrix.api }})
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [26, 36]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle
      - name: Enable KVM
        working-directory: .
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Throwaway signing key (CI only, not the Play upload key)
        run: |
          keytool -genkeypair -keystore "$RUNNER_TEMP/ci.jks" -storepass cipass -keypass cipass \
            -alias ci -keyalg RSA -keysize 2048 -validity 1 -dname "CN=CI"
          echo "MANABIKKO_STOREFILE=$RUNNER_TEMP/ci.jks" >> "$GITHUB_ENV"
          echo "MANABIKKO_STOREPASSWORD=cipass" >> "$GITHUB_ENV"
          echo "MANABIKKO_KEYALIAS=ci" >> "$GITHUB_ENV"
          echo "MANABIKKO_KEYPASSWORD=cipass" >> "$GITHUB_ENV"
      - name: Build release APK and test APKs
        run: ./gradlew --no-daemon assembleRelease assembleDebug assembleDebugAndroidTest
      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          working-directory: manabikko
          script: ./ci/emulator-check.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: emulator-api${{ matrix.api }}
          path: |
            manabikko/build/emulator-results
            manabikko/app/build/reports/androidTests
            manabikko/app/build/outputs/androidTest-results
