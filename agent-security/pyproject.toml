[project]
name = "secagent"
version = "0.1.0"
description = "Autonomous ADK agent with Skill-defined business tasks, a security plugin and OTel telemetry for red/blue-team evaluation"
requires-python = ">=3.10"
dependencies = [
  # Pinned: ADK 2.x changes fast and the plugin relies on exact hook signatures.
  "google-adk[mcp]==2.11.0",
  "anthropic>=1.0",
  # ADK 2.11 caps opentelemetry-api/sdk at 1.42.1; keep the exporter in step.
  "opentelemetry-exporter-otlp-proto-http==1.42.1",
  "pyyaml>=6",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["src"]
